name: Supabase

on:
  pull_request:
    paths: ['supabase/**', 'scripts/check-migrations.mjs', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/check-migrations.mjs', '.github/workflows/supabase.yml']
  workflow_dispatch:
    inputs:
      que_desplegar:
        description: Qué se despliega
        type: choice
        default: solo-listar
        options:
          - solo-listar
          - migraciones
          - funciones
          - migraciones-y-funciones

env:
  # No es un secreto: ya aparece en vercel.json y en las URLs públicas de storage.
  PROJECT_REF: zaxbtnjkidqwzqsehvld

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Bloquea el merge. No necesita credenciales ni Docker: es solo higiene de
  # nombres, que es lo que rompe `supabase db push` (versiones duplicadas).
  # ---------------------------------------------------------------------------
  nombres:
    name: Nombres de migración
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/check-migrations.mjs

  # ---------------------------------------------------------------------------
  # Levanta un Supabase limpio y aplica las 52 migraciones desde cero. Es la
  # única forma de saber si el histórico sigue siendo reproducible.
  #
  # Bloquea desde el 2026-08-11, cuando el histórico se saneó y empezó a pasar
  # en verde. Es la única prueba de que el proyecto se puede reconstruir desde
  # el repositorio; si se pone en rojo, algo ha dejado de ser reproducible y hay
  # que arreglarlo, no saltárselo.
  # ---------------------------------------------------------------------------
  esquema:
    name: Migraciones desde cero
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Versión fija: con `latest` la acción resuelve la release por la API de
      # GitHub sin autenticar y salta el rate limit en cuanto hay varios runs
      # a la vez (pasó en el primer push, con los PR de Dependabot en paralelo).
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      # `supabase start` aplica supabase/migrations al crear la base. Si una
      # migración tiene SQL inválido, o depende de algo que no crea ninguna
      # migración, este paso falla.
      - name: Levantar Supabase local
        id: arrancar
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,mailpit

      - name: Avisos del linter de Postgres
        if: steps.arrancar.outcome == 'success'
        run: supabase db lint --level warning
        continue-on-error: true

      # Solo si llegó a arrancar: si falló la instalación de la CLI, `supabase`
      # no existe y este paso moría con "command not found".
      - name: Parar
        if: always() && steps.arrancar.outcome != 'skipped'
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # Despliegue. Solo manual (Actions → Supabase → Run workflow) y nunca en push:
  # no hay entorno de staging, así que lo que se aplique aquí va directo a la
  # base de datos con la que trabajan las familias.
  #
  # Secrets necesarios en el repositorio:
  #   SUPABASE_ACCESS_TOKEN  → Supabase → Account → Access Tokens
  #   SUPABASE_DB_PASSWORD   → contraseña de Postgres del proyecto
  # ---------------------------------------------------------------------------
  desplegar:
    name: Desplegar a producción
    if: github.event_name == 'workflow_dispatch'
    needs: [nombres]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Enlazar proyecto
        run: supabase link --project-ref "$PROJECT_REF"

      # Siempre, incluso en modo solo-listar: deja por escrito en el log qué
      # migraciones tiene el repo y cuáles la base de datos remota.
      - name: Comparar migraciones locales y remotas
        run: supabase migration list --linked

      # Sin --include-all a propósito: ese flag reaplica migraciones anteriores
      # a la última remota, y el histórico tiene versiones de 8 dígitos que
      # ordenan de forma engañosa.
      - name: Aplicar migraciones
        if: contains(github.event.inputs.que_desplegar, 'migraciones')
        run: supabase db push

      - name: Desplegar Edge Functions
        if: contains(github.event.inputs.que_desplegar, 'funciones')
        run: supabase functions deploy --project-ref "$PROJECT_REF"
