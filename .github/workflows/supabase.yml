name: Supabase

on:
  pull_request:
    paths: ['supabase/**', 'scripts/check-migrations.mjs', 'scripts/check-rls.sql', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/check-migrations.mjs', 'scripts/check-rls.sql', '.github/workflows/supabase.yml']
  workflow_dispatch:
    inputs:
      que_desplegar:
        description: Qué se despliega
        type: choice
        default: solo-listar
        options:
          - solo-listar
          - migraciones
          - funciones
          - migraciones-y-funciones
          - reparar-historico
          - probar-avisos
      funcion:
        description: 'Función a desplegar (vacío = todas). Desplegarlas todas reaplica la política verify_jwt de config.toml a funciones que quizá se subieron a mano con --no-verify-jwt.'
        type: string
        default: ''

env:
  # No es un secreto: ya aparece en vercel.json y en las URLs públicas de storage.
  PROJECT_REF: zaxbtnjkidqwzqsehvld

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Bloquea el merge. No necesita credenciales ni Docker: es solo higiene de
  # nombres, que es lo que rompe `supabase db push` (versiones duplicadas).
  # ---------------------------------------------------------------------------
  nombres:
    name: Nombres de migración
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/check-migrations.mjs

  # ---------------------------------------------------------------------------
  # Levanta un Supabase limpio y aplica las 52 migraciones desde cero. Es la
  # única forma de saber si el histórico sigue siendo reproducible.
  #
  # Bloquea desde el 2026-08-11, cuando el histórico se saneó y empezó a pasar
  # en verde. Es la única prueba de que el proyecto se puede reconstruir desde
  # el repositorio; si se pone en rojo, algo ha dejado de ser reproducible y hay
  # que arreglarlo, no saltárselo.
  # ---------------------------------------------------------------------------
  esquema:
    name: Migraciones desde cero
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Versión fija: con `latest` la acción resuelve la release por la API de
      # GitHub sin autenticar y salta el rate limit en cuanto hay varios runs
      # a la vez (pasó en el primer push, con los PR de Dependabot en paralelo).
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      # `supabase start` aplica supabase/migrations al crear la base. Si una
      # migración tiene SQL inválido, o depende de algo que no crea ninguna
      # migración, este paso falla.
      - name: Levantar Supabase local
        id: arrancar
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,mailpit

      # Bloquea. Lo que comprueba (RLS y políticas reales) no se puede leer de
      # las migraciones con expresiones regulares: hay políticas dentro de
      # bloques comentados y migraciones que deshacen lo que hizo otra. Solo la
      # base ya construida dice la verdad. Ver la cabecera del propio SQL.
      - name: Permisos y RLS
        if: steps.arrancar.outcome == 'success'
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/check-rls.sql

      # Red anti-deriva: el esquema que producen las migraciones tiene que ser
      # idéntico al que hay commiteado. Si alguien toca la base a mano por el
      # panel y luego escribe una migración que no hace lo mismo, aquí se ve.
      - name: Volcar el esquema construido
        if: steps.arrancar.outcome == 'success'
        run: |
          set -euo pipefail
          supabase db dump --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f esquema-construido.sql

      - name: Comparar con la instantánea del repositorio
        if: steps.arrancar.outcome == 'success'
        run: |
          set -euo pipefail
          if [ ! -f supabase/schema.snapshot.sql ]; then
            echo "::warning::No hay supabase/schema.snapshot.sql. Descarga el artefacto 'esquema-construido' de este run, revísalo y haz commit como supabase/schema.snapshot.sql para armar la comprobación de deriva."
            echo "### Falta la instantánea del esquema" >> "$GITHUB_STEP_SUMMARY"
            echo "Descarga el artefacto \`esquema-construido\` y haz commit del fichero como \`supabase/schema.snapshot.sql\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! diff -u supabase/schema.snapshot.sql esquema-construido.sql > deriva.diff; then
            echo "::error::El esquema que producen las migraciones ya no coincide con supabase/schema.snapshot.sql"
            head -100 deriva.diff
            echo "Si el cambio es intencionado, actualiza la instantánea en el mismo PR que la migración."
            exit 1
          fi
          echo "Esquema idéntico a la instantánea."

      - name: Guardar el esquema construido
        if: always() && steps.arrancar.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: esquema-construido
          path: |
            esquema-construido.sql
            deriva.diff
          retention-days: 7
          if-no-files-found: ignore

      - name: Avisos del linter de Postgres
        if: steps.arrancar.outcome == 'success'
        run: supabase db lint --level warning
        continue-on-error: true

      # Solo si llegó a arrancar: si falló la instalación de la CLI, `supabase`
      # no existe y este paso moría con "command not found".
      - name: Parar
        if: always() && steps.arrancar.outcome != 'skipped'
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # Despliegue. Solo manual (Actions → Supabase → Run workflow) y nunca en push:
  # no hay entorno de staging, así que lo que se aplique aquí va directo a la
  # base de datos con la que trabajan las familias.
  #
  # Secrets necesarios en el repositorio:
  #   SUPABASE_ACCESS_TOKEN  → Supabase → Account → Access Tokens
  #   SUPABASE_DB_PASSWORD   → contraseña de Postgres del proyecto
  # ---------------------------------------------------------------------------
  desplegar:
    name: Desplegar a producción
    if: github.event_name == 'workflow_dispatch'
    needs: [nombres]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Enlazar proyecto
        run: supabase link --project-ref "$PROJECT_REF"

      # Siempre, incluso en modo solo-listar: deja por escrito en el log qué
      # migraciones tiene el repo y cuáles la base de datos remota.
      - name: Comparar migraciones locales y remotas
        run: supabase migration list --linked

      # Solo nombres, nunca valores. Sirve para responder a la pregunta que más
      # veces deja una alerta muerta sin que nadie se entere: ¿está configurado
      # el secreto que la función exige? Sin USAGE_ALERT_SECRET, activity-alert
      # y usage-alert devuelven 500 y no avisan de nada.
      - name: Secretos de las Edge Functions
        run: supabase secrets list --project-ref "$PROJECT_REF"

      # Retira del historial remoto las versiones que creó el panel y que este
      # repositorio no ha tenido nunca. Sin esto, `db push` se niega a trabajar
      # ("Remote migration versions not found in local migrations directory") y
      # el despliegue de migraciones está bloqueado.
      #
      # Solo toca supabase_migrations.schema_migrations: no borra ni cambia
      # ninguna tabla, función ni política. El motivo completo y la lista están
      # en supabase/legacy-remote-versions.txt.
      - name: Reparar histórico remoto
        if: github.event.inputs.que_desplegar == 'reparar-historico'
        run: |
          set -euo pipefail
          versiones=$(grep -vE '^\s*(#|$)' supabase/legacy-remote-versions.txt | tr '\n' ' ')
          echo "Retirando $(echo $versiones | wc -w) versiones del historial remoto."
          supabase migration repair --status reverted $versiones

      # Sin --include-all a propósito: ese flag reaplica migraciones anteriores
      # a la última remota, y el histórico tiene versiones de 8 dígitos que
      # ordenan de forma engañosa.
      - name: Aplicar migraciones
        if: contains(github.event.inputs.que_desplegar, 'migraciones')
        run: supabase db push

      # Sin nombre despliega todas, que es lo que había antes. Con nombre, solo
      # esa: subir una función nueva no tiene por qué tocar las seis.
      # Dispara la llamada EXACTAMENTE como la hace pg_cron: mismo secreto leído
      # de vault, misma cabecera. Es la única forma de saber si el aviso llegará
      # de verdad, porque el fallo típico no da error en ningún sitio: el valor
      # guardado en vault y el secreto de la función no coinciden, la función
      # responde 401 y el correo no sale nunca.
      #
      # Con ?test=true la función fuerza el camino del aviso, así que ESTO MANDA
      # UN CORREO REAL a NOTIFICATION_EMAILS. No toca alert_state, así que no
      # interfiere con el aviso de verdad.
      - name: Probar los avisos de extremo a extremo
        if: github.event.inputs.que_desplegar == 'probar-avisos'
        run: |
          set -euo pipefail

          consultar() {
            jq -Rs '{query: .}' > /tmp/payload.json
            curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/payload.json
            echo
          }

          echo "--- ¿existe el secreto en vault y están los crons activos?"
          consultar <<'SQL'
          SELECT
            (SELECT count(*) FROM vault.decrypted_secrets WHERE name = 'usage_alert_secret') AS secreto_en_vault,
            (SELECT count(*) FROM cron.job WHERE jobname = 'daily-activity-alert' AND active) AS cron_activity,
            (SELECT count(*) FROM cron.job WHERE jobname = 'weekly-usage-alert'  AND active) AS cron_usage;
          SQL

          echo "--- llamada real a activity-alert con el secreto de vault (manda un correo)"
          consultar <<SQL
          WITH peticion AS (
            SELECT net.http_post(
              url     := 'https://$PROJECT_REF.supabase.co/functions/v1/activity-alert?test=true',
              headers := jsonb_build_object(
                'Content-Type',   'application/json',
                'x-alert-secret', (SELECT decrypted_secret FROM vault.decrypted_secrets WHERE name = 'usage_alert_secret' LIMIT 1)
              ),
              body    := '{}'::jsonb
            ) AS id
          ), espera AS (
            SELECT id FROM peticion, pg_sleep(10)
          )
          SELECT r.status_code, left(r.content, 300) AS respuesta
            FROM espera e
            LEFT JOIN net._http_response r ON r.id = e.id;
          SQL

          echo "--- 200 = el aviso funciona de punta a punta. 401 = el valor de vault no coincide con USAGE_ALERT_SECRET."

      - name: Desplegar Edge Functions
        if: contains(github.event.inputs.que_desplegar, 'funciones')
        run: supabase functions deploy ${{ github.event.inputs.funcion }} --project-ref "$PROJECT_REF"
